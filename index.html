<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi 3D Layout Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Mencegah scrollbar */
            background-color: #1a202c; /* Warna latar belakang fallback */
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Biarkan klik tembus ke kanvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            z-index: 10;
            display: none; /* Disembunyikan sebelum memilih skenario */
        }
        .ui-panel {
            pointer-events: auto; /* Panel UI bisa di-klik */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1rem;
        }
        /* Loading screen styling */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2d3748;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 50; transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top: 4px solid #fff;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Landing Page Menu */
        #landing-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 100;
        }
    </style>
</head>
<body>

    <!-- LAYAR AWAL / MENU SKENARIO -->
    <div id="landing-page">
        <h2 class="text-3xl font-bold mb-2">Visualisasi 3D Gudang</h2>
        <p class="text-gray-400 mb-8">Pilih layout yang ingin Anda tampilkan</p>
        <div class="flex gap-4">
            <button onclick="startApp(1)" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold shadow-lg transition">Mulai Skenario 1<br><span class="text-sm font-normal">(Kalibrasi Eksisting)</span></button>
            <button onclick="startApp(2)" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-lg font-semibold shadow-lg transition">Mulai Skenario 2<br><span class="text-sm font-normal">(Layout Usulan)</span></button>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="display: none;">
        <div class="spinner"></div>
        <h2 class="text-xl font-semibold">Membangun Gudang 3D...</h2>
        <p class="text-sm text-gray-300 mt-2">Memuat geometri dan material</p>
    </div>

    <!-- UI LAYER DALAM 3D -->
    <div id="ui-layer">
        <div class="ui-panel max-w-sm">
            <h1 class="text-lg font-bold text-gray-800 border-b pb-2 mb-2">Gudang 72m x 24m</h1>
            <p class="text-sm text-gray-600 mb-2">Navigasi: <b>Klik Kiri + Seret</b> untuk memutar, <b>Scroll</b> untuk zoom, <b>Klik Kanan + Seret</b> untuk geser.</p>
            <div class="flex flex-wrap gap-2 text-xs mb-2">
                <span class="px-2 py-1 bg-indigo-100 text-indigo-800 rounded">Rak Slow Moving (Heavy)</span>
                <span class="px-2 py-1 bg-gray-200 text-gray-800 rounded">Rak Fast Moving (Small)</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded">Floor Area</span>
                <span class="px-2 py-1 bg-pink-100 text-pink-800 rounded">Karantina</span>
            </div>
            
            <!-- TOMBOL SWITCH SKENARIO -->
            <div class="mt-2 border-t pt-3 flex gap-2">
                <button id="btn-scen-1" onclick="switchScenario(1)" class="w-1/2 bg-blue-600 text-white font-semibold py-1.5 rounded shadow transition text-sm">Skenario 1</button>
                <button id="btn-scen-2" onclick="switchScenario(2)" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm">Skenario 2</button>
            </div>

            <div class="mt-3 border-t pt-3">
                <button id="toggle-roof" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-1 px-4 rounded shadow transition text-sm">
                    Sembunyikan Atap
                </button>
            </div>
        </div>
        <div class="self-end pb-4 pr-4 pointer-events-auto">
            <button id="reset-cam" class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded shadow">
                Reset Kamera
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const WAREHOUSE_LENGTH = 72;
        const WAREHOUSE_WIDTH = 24;
        const WALL_HEIGHT = 6;
        const ROOF_HEIGHT = 10; 

        let scene, camera, renderer, controls;
        let roofGroup = new THREE.Group();
        let currentScenarioGroup = new THREE.Group(); // Group untuk layout dinamis
        
        const colors = {
            floor: 0xd9d5c3, wall: 0xeeeeee, pillar: 0x8b251e,
            roofExterior: 0xa0a0a0, roofInterior: 0xd0d0d0,
            rackHeavyFrame: 0x1565C0, rackHeavyBeam: 0xFF6600,
            rackSmallFrame: 0x9E9E9E, rackSmallShelf: 0xE0E0E0,
            officeWall: 0xf0f0f0,
            floorAreaBox: 0xcce0ff, karantinaBox: 0xffdcdc, packingBox: 0xd4edda,
            forkliftPath: 0xFFC107, pedestrianPath: 0x4CAF50, lineColor: 0x333333
        };

        let appInitialized = false;

        function startApp(scenarioId) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';
            
            setTimeout(() => {
                if (!appInitialized) {
                    init();
                    appInitialized = true;
                }
                switchScenario(scenarioId);
                
                document.getElementById('ui-layer').style.display = 'flex';
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 100); // Simulasi loading tipis
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 150);
            scene.add(currentScenarioGroup); // Tambahkan group dinamis ke scene

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-20, 40, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.physicallyCorrectLights = false; 
            renderer.toneMapping = THREE.NoToneMapping; 
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.target.set(WAREHOUSE_LENGTH / 2, 0, WAREHOUSE_WIDTH / 2);

            setupLighting();
            buildStaticWarehouse(); // Hanya bangun Bangunan Statis (Lantai, Dinding, Atap)

            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('toggle-roof').addEventListener('click', toggleRoof);
            document.getElementById('reset-cam').addEventListener('click', resetCamera);

            animate();
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 0.7); 
            hemiLight.position.set(0, 100, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(50, 80, 40);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.bias = -0.001; 
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = WAREHOUSE_LENGTH + 20;
            dirLight.shadow.camera.top = WAREHOUSE_WIDTH + 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);
        }

        // ==========================================
        // BANGUNAN STATIS (Tidak berubah per skenario)
        // ==========================================
        function buildStaticWarehouse() {
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a5d23, roughness: 1.0, metalness: 0.0 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.2;
            ground.receiveShadow = true;
            scene.add(ground);

            const slabThickness = 0.2;
            const floorGeo = new THREE.BoxGeometry(WAREHOUSE_LENGTH, slabThickness, WAREHOUSE_WIDTH);
            const floorMat = new THREE.MeshStandardMaterial({ color: colors.floor, roughness: 1.0, metalness: 0.0 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(WAREHOUSE_LENGTH/2, -slabThickness/2, WAREHOUSE_WIDTH/2);
            floor.receiveShadow = true;
            scene.add(floor);

            const wallThickness = 0.2;
            const wallMat = new THREE.MeshStandardMaterial({ color: colors.wall, side: THREE.DoubleSide });

            const wallNorth = new THREE.Mesh(new THREE.BoxGeometry(WAREHOUSE_LENGTH, WALL_HEIGHT, wallThickness), wallMat);
            wallNorth.position.set(WAREHOUSE_LENGTH/2, WALL_HEIGHT/2, 0);
            wallNorth.castShadow = true; wallNorth.receiveShadow = true;
            scene.add(wallNorth);

            const wallSouth = new THREE.Mesh(new THREE.BoxGeometry(WAREHOUSE_LENGTH, WALL_HEIGHT, wallThickness), wallMat);
            wallSouth.position.set(WAREHOUSE_LENGTH/2, WALL_HEIGHT/2, WAREHOUSE_WIDTH);
            wallSouth.castShadow = true; wallSouth.receiveShadow = true;
            scene.add(wallSouth);

            const wallWest = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, WALL_HEIGHT, WAREHOUSE_WIDTH), wallMat);
            wallWest.position.set(0, WALL_HEIGHT/2, WAREHOUSE_WIDTH/2);
            wallWest.castShadow = true; wallWest.receiveShadow = true;
            scene.add(wallWest);

            createEastWallWithDoors(wallThickness, wallMat);

            function createStripeTex(c1, c2) {
                const cv = document.createElement('canvas');
                cv.width = 128; cv.height = 128;
                const ctx = cv.getContext('2d');
                ctx.fillStyle = c1; ctx.fillRect(0,0,128,128);
                ctx.fillStyle = c2; 
                ctx.beginPath();
                for(let i=-128; i<256; i+=32) {
                    ctx.moveTo(i,0); ctx.lineTo(i+32,128); ctx.lineTo(i+48,128); ctx.lineTo(i+16,0);
                }
                ctx.fill();
                const tex = new THREE.CanvasTexture(cv);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }
            const hazardMat = new THREE.MeshBasicMaterial({ map: createStripeTex('#FFC107', '#000000') }); 
            const keepClearMat = new THREE.MeshBasicMaterial({ map: createStripeTex('#FF0000', '#FFFFFF') });

            const kcGeo = new THREE.BoxGeometry(4, 0.01, 3);
            const kc1 = new THREE.Mesh(kcGeo, keepClearMat);
            kc1.position.set(WAREHOUSE_LENGTH - 2, 0.02, 2 + 2.5);
            scene.add(kc1);
            const kc2 = new THREE.Mesh(kcGeo, keepClearMat);
            kc2.position.set(WAREHOUSE_LENGTH - 2, 0.02, WAREHOUSE_WIDTH - 2 - 2.5);
            scene.add(kc2);

            const pillarGeo = new THREE.BoxGeometry(0.4, WALL_HEIGHT, 0.4); 
            const pillarMat = new THREE.MeshStandardMaterial({ color: colors.pillar, metalness: 0.3, roughness: 0.7 });

            for (let i = 0; i <= 12; i++) {
                const xPos = i * 6;
                let p1 = new THREE.Mesh(pillarGeo, pillarMat);
                p1.position.set(xPos, WALL_HEIGHT/2, 0.2); 
                p1.castShadow = true;
                scene.add(p1);
                
                let p1Hazard = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.0, 0.42), hazardMat);
                p1Hazard.position.set(xPos, 0.5, 0.2);
                scene.add(p1Hazard);
                
                let p2 = new THREE.Mesh(pillarGeo, pillarMat);
                p2.position.set(xPos, WALL_HEIGHT/2, WAREHOUSE_WIDTH - 0.2);
                p2.castShadow = true;
                scene.add(p2);

                let p2Hazard = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.0, 0.42), hazardMat);
                p2Hazard.position.set(xPos, 0.5, WAREHOUSE_WIDTH - 0.2);
                scene.add(p2Hazard);
            }

            const roofShape = new THREE.Shape();
            roofShape.moveTo(0, WALL_HEIGHT);
            roofShape.lineTo(WAREHOUSE_WIDTH / 2, ROOF_HEIGHT); 
            roofShape.lineTo(WAREHOUSE_WIDTH, WALL_HEIGHT);
            roofShape.lineTo(WAREHOUSE_WIDTH, WALL_HEIGHT + 0.2); 
            roofShape.lineTo(WAREHOUSE_WIDTH / 2, ROOF_HEIGHT + 0.2);
            roofShape.lineTo(0, WALL_HEIGHT + 0.2);
            roofShape.lineTo(0, WALL_HEIGHT);

            const extrudeSettings = { steps: 1, depth: WAREHOUSE_LENGTH, bevelEnabled: false };
            const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
            const roofMat = new THREE.MeshStandardMaterial({ color: colors.roofExterior, side: THREE.DoubleSide, roughness: 0.6 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.rotation.y = Math.PI / 2;
            roof.position.set(0, 0, WAREHOUSE_WIDTH); 
            roof.castShadow = true;
            
            buildRoofTrusses(trussMat = new THREE.MeshStandardMaterial({ color: colors.pillar, metalness: 0.6, roughness: 0.4 }));
            roofGroup.add(roof);
            scene.add(roofGroup);
        }

        function createEastWallWithDoors(thick, mat) {
            const doorWidth = 5; const doorHeight = 4.5;
            const w1 = new THREE.Mesh(new THREE.BoxGeometry(thick, WALL_HEIGHT, 2), mat);
            w1.position.set(WAREHOUSE_LENGTH, WALL_HEIGHT/2, 1); scene.add(w1);

            const middleWidth = WAREHOUSE_WIDTH - (2 * doorWidth) - 4; 
            const w2 = new THREE.Mesh(new THREE.BoxGeometry(thick, WALL_HEIGHT, middleWidth), mat);
            w2.position.set(WAREHOUSE_LENGTH, WALL_HEIGHT/2, WAREHOUSE_WIDTH/2); scene.add(w2);

            const w3 = new THREE.Mesh(new THREE.BoxGeometry(thick, WALL_HEIGHT, 2), mat);
            w3.position.set(WAREHOUSE_LENGTH, WALL_HEIGHT/2, WAREHOUSE_WIDTH - 1); scene.add(w3);

            const topDoorGeo = new THREE.BoxGeometry(thick, WALL_HEIGHT - doorHeight, doorWidth);
            const td1 = new THREE.Mesh(topDoorGeo, mat);
            td1.position.set(WAREHOUSE_LENGTH, doorHeight + (WALL_HEIGHT - doorHeight)/2, 2 + doorWidth/2); scene.add(td1);

            const td2 = new THREE.Mesh(topDoorGeo, mat);
            td2.position.set(WAREHOUSE_LENGTH, doorHeight + (WALL_HEIGHT - doorHeight)/2, WAREHOUSE_WIDTH - 2 - doorWidth/2); scene.add(td2);
            
            const gableGeo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                0, WALL_HEIGHT, 0,
                0, ROOF_HEIGHT, WAREHOUSE_WIDTH/2,
                0, WALL_HEIGHT, WAREHOUSE_WIDTH
            ]);
            gableGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            gableGeo.computeVertexNormals();
            
            const gableEast = new THREE.Mesh(gableGeo, mat);
            gableEast.position.set(WAREHOUSE_LENGTH, 0, 0); scene.add(gableEast);

            const gableWest = new THREE.Mesh(gableGeo, new THREE.MeshStandardMaterial({ color: colors.wall, side: THREE.DoubleSide }));
            gableWest.position.set(0, 0, 0); scene.add(gableWest);
        }

        function buildRoofTrusses(trussMat) {
            function createBeam(p1, p2) {
                const distance = p1.distanceTo(p2);
                const geo = new THREE.CylinderGeometry(0.08, 0.08, distance, 8); 
                const mesh = new THREE.Mesh(geo, trussMat);
                mesh.position.copy(p1).lerp(p2, 0.5);
                const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                mesh.castShadow = true; return mesh;
            }
            for (let i = 0; i <= 12; i++) {
                const xPos = i * 6;
                const pBL = new THREE.Vector3(xPos, WALL_HEIGHT, 0); 
                const pBR = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH); 
                const pTop = new THREE.Vector3(xPos, ROOF_HEIGHT, WAREHOUSE_WIDTH/2); 
                const pMid = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH/2); 
                const pZ1 = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH/4);
                const pZ2 = new THREE.Vector3(xPos, WALL_HEIGHT + (ROOF_HEIGHT-WALL_HEIGHT)/2, WAREHOUSE_WIDTH/2);
                const pZ3 = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH*0.75);

                roofGroup.add(createBeam(pBL, pBR)); roofGroup.add(createBeam(pBL, pTop)); roofGroup.add(createBeam(pBR, pTop)); 
                roofGroup.add(createBeam(pMid, pTop)); roofGroup.add(createBeam(pBL, pZ2)); roofGroup.add(createBeam(pZ1, pTop));
                roofGroup.add(createBeam(pBR, pZ2)); roofGroup.add(createBeam(pZ3, pTop));
            }
        }

        // ==========================================
        // FUNGSI HELPER INTERIOR & DEMARKASI
        // ==========================================
        function createArea(x, z, w, d, color, name) {
            const yPos = 0.02; 
            const lineThickness = 0.1; 
            const borderMat = new THREE.MeshBasicMaterial({ color: color });
            
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.01, lineThickness), borderMat);
            top.position.set(x + w/2, yPos, z); currentScenarioGroup.add(top);

            const bottom = new THREE.Mesh(new THREE.BoxGeometry(w, 0.01, lineThickness), borderMat);
            bottom.position.set(x + w/2, yPos, z + d); currentScenarioGroup.add(bottom);

            const left = new THREE.Mesh(new THREE.BoxGeometry(lineThickness, 0.01, d), borderMat);
            left.position.set(x, yPos, z + d/2); currentScenarioGroup.add(left);

            const right = new THREE.Mesh(new THREE.BoxGeometry(lineThickness, 0.01, d), borderMat);
            right.position.set(x + w, yPos, z + d/2); currentScenarioGroup.add(right);
        }

        function createRackRow(x, z, width, depth, levels, frameColorStr, shelfColorStr, isDouble = false, customHeight = 4.5, yOffset = 0, hasPallets = false, hasJoliBoxes = false) {
            const group = new THREE.Group();
            group.position.set(x + width/2, yOffset, z + depth/2);

            const frameMat = new THREE.MeshStandardMaterial({ color: frameColorStr, metalness: 0.6, roughness: 0.4 });
            const beamMat = new THREE.MeshStandardMaterial({ color: shelfColorStr, metalness: 0.5, roughness: 0.5 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.9 }); 

            if (yOffset === 0) {
                const lineW = width + 0.3; const lineD = depth + 0.3; const lineT = 0.1; 
                const yMat = new THREE.MeshBasicMaterial({ color: 0xFFC107 });
                const yPosLine = 0.03; 
                const l1 = new THREE.Mesh(new THREE.BoxGeometry(lineW, 0.01, lineT), yMat); l1.position.set(0, yPosLine, -lineD/2);
                const l2 = new THREE.Mesh(new THREE.BoxGeometry(lineW, 0.01, lineT), yMat); l2.position.set(0, yPosLine, lineD/2);
                const l3 = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, lineD), yMat); l3.position.set(-lineW/2, yPosLine, 0);
                const l4 = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, lineD), yMat); l4.position.set(lineW/2, yPosLine, 0);
                group.add(l1, l2, l3, l4);
            }

            const bayLength = 2.6; 
            const numBays = Math.max(1, Math.round(depth / bayLength));
            const actualBayLength = depth / numBays;
            const postThickness = 0.1;
            
            let xPositions = isDouble ? [-width/2 + postThickness/2, 0, width/2 - postThickness/2] : [-width/2 + postThickness/2, width/2 - postThickness/2];

            for (let i = 0; i <= numBays; i++) {
                const zPos = -depth/2 + (i * actualBayLength);
                xPositions.forEach(xPos => {
                    const post = new THREE.Mesh(new THREE.BoxGeometry(postThickness, customHeight, postThickness), frameMat);
                    post.position.set(xPos, customHeight/2, zPos);
                    post.castShadow = true; post.receiveShadow = true; group.add(post);
                });
            }

            const beamThickness = 0.08; const beamHeight = 0.15;
            for (let lvl = 1; lvl <= levels; lvl++) {
                const yPos = lvl * (customHeight / levels);
                xPositions.forEach(xPos => {
                    const beam = new THREE.Mesh(new THREE.BoxGeometry(beamThickness, beamHeight, depth), beamMat);
                    beam.position.set(xPos, yPos, 0); beam.castShadow = true; beam.receiveShadow = true; group.add(beam);
                });
                const shelf = new THREE.Mesh(new THREE.BoxGeometry(width - postThickness*2, 0.02, depth - postThickness*2), woodMat);
                shelf.position.set(0, yPos, 0); shelf.castShadow = true; shelf.receiveShadow = true; group.add(shelf);

                // TAMBAHAN PALET
                if (hasPallets) {
                    const palletDepth = 1.0; const palletWidth = 0.8; const spacing = 0.2; 
                    const numPallets = Math.floor((depth - postThickness*2) / (palletDepth + spacing));
                    const startZOffset = -depth/2 + postThickness + (palletDepth/2) + 0.1;
                    let xOffsets = isDouble ? [-width/4, width/4] : [0];

                    for (let p = 0; p < numPallets; p++) {
                        const pzPos = startZOffset + p * (palletDepth + spacing);
                        xOffsets.forEach(px => {
                            if (Math.random() > 0.2) {
                                const pallet = new THREE.Mesh(new THREE.BoxGeometry(palletWidth, 0.12, palletDepth), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 }));
                                const pY = yPos + 0.01 + 0.06; pallet.position.set(px, pY, pzPos); pallet.castShadow = true; group.add(pallet);
                                
                                const boxH = 0.5 + Math.random() * 0.4;
                                const isCardboard = Math.random() > 0.3;
                                const box = new THREE.Mesh(new THREE.BoxGeometry(palletWidth - 0.05, boxH, palletDepth - 0.05), new THREE.MeshStandardMaterial({ color: isCardboard ? 0xb08d6a : 0x778899, roughness: 0.8 }));
                                box.position.set(px, pY + 0.06 + boxH/2, pzPos); box.castShadow = true; group.add(box);
                            }
                        });
                    }
                }

                // TAMBAHAN JOLI BOX
                if (hasJoliBoxes) {
                    const jBoxW = 0.3; const jBoxD = 0.4; const jBoxH = 0.25; const jSpacingX = 0.05; const jSpacingZ = 0.05;
                    const joliColors = [0x1976D2, 0xD32F2F, 0xFBC02D, 0x388E3C]; 
                    const usableDepth = depth - postThickness * 2;
                    const numJBoxZ = Math.floor(usableDepth / (jBoxD + jSpacingZ));
                    const startJZOffset = -depth/2 + postThickness + (jBoxD/2);
                    const usableWidth = isDouble ? (width/2 - postThickness*1.5) : (width - postThickness*2);
                    const numJBoxX = Math.floor(usableWidth / (jBoxW + jSpacingX));
                    let xCenters = isDouble ? [-width/4, width/4] : [0]; 

                    for (let jz = 0; jz < numJBoxZ; jz++) {
                        const jzPos = startJZOffset + jz * (jBoxD + jSpacingZ);
                        xCenters.forEach(centerX => {
                            const startJXOffset = centerX - (usableWidth/2) + (jBoxW/2);
                            for (let jx = 0; jx < numJBoxX; jx++) {
                                if (Math.random() > 0.25) {
                                    const px = startJXOffset + jx * (jBoxW + jSpacingX);
                                    const jColor = joliColors[Math.floor(Math.random() * joliColors.length)];
                                    const jBox = new THREE.Mesh(new THREE.BoxGeometry(jBoxW, jBoxH, jBoxD), new THREE.MeshStandardMaterial({ color: jColor, roughness: 0.6 }));
                                    jBox.position.set(px, yPos + 0.01 + jBoxH/2, jzPos); jBox.castShadow = true; group.add(jBox);
                                }
                            }
                        });
                    }
                }
            }
            currentScenarioGroup.add(group);
        }

                    const offsetX = directionX * (i * stepW + stepW/2);

            // ==========================================
            // TAMBAHAN: SPANDUK AREA & K3/5R
            // ==========================================
            function createBanner(text, bgColor, fgColor, width, height) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Border
                ctx.strokeStyle = fgColor;
                ctx.lineWidth = 15;
                ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

                // Text
                ctx.fillStyle = fgColor;
                ctx.font = 'bold 70px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                
                const tex = new THREE.CanvasTexture(canvas);
                const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
                const geo = new THREE.PlaneGeometry(width, height);
                return new THREE.Mesh(geo, mat);
            }

            currentScenarioGroup.add(bModNE);

            const bKarantina = createBanner("AREA KARANTINA", "#ff0000", "#ffffff", 6, 1.2);
            bKarantina.position.set(42, bannerY, zWallNorth); 
            currentScenarioGroup.add(bKarantina);

            const bTransit = createBanner("AREA TRANSIT", "#f39c12", "#ffffff", 6, 1.2);
            bTransit.position.set(54, bannerY, zWallNorth); 
            currentScenarioGroup.add(bTransit);

            // 2. Spanduk K3 & 5R di Dinding Belakang Office (Menghadap Gudang)
            const xOfficeWall = 62.85; // Menempel di dinding barat Office

            const bK3 = createBanner("UTAMAKAN K3", "#4CAF50", "#ffffff", 4.5, 1.2);
            bK3.position.set(xOfficeWall, bannerY, 9);
            bK3.rotation.y = -Math.PI / 2; // Diputar agar menghadap ke dalam gudang (barat)
            currentScenarioGroup.add(bK3);

            const b5R = createBanner("BUDAYAKAN 5R", "#2196F3", "#ffffff", 4.5, 1.2);
            b5R.position.set(xOfficeWall, bannerY, 15);
            b5R.rotation.y = -Math.PI / 2;
            currentScenarioGroup.add(b5R);

            // ==========================================
            // TAMBAHAN: AKTIVITAS LOADING & UNLOADING (PINTU TIMUR)
            // ==========================================
            // Area Loading (Pintu Out - Utara Z=4.5)
            createTruck(77, 4.5, 0, currentScenarioGroup); // Truk parkir, bak menghadap pintu gudang
            createForklift(72.5, 4.5, 0, currentScenarioGroup); // Forklift memuat barang ke truk
            createWorker(73.5, 3.5, -Math.PI / 4, 0xFF9800, currentScenarioGroup); // Pekerja mengarahkan
            
            // Area Unloading (Pintu In - Selatan Z=19.5)
            createTruck(77, 19.5, 0, currentScenarioGroup); // Truk parkir
            createForklift(72.5, 19.5, 0, currentScenarioGroup); // Forklift membongkar barang dari truk
            createWorker(73.5, 20.5, Math.PI / 4, 0xFF9800, currentScenarioGroup); // Pekerja mengarahkan

            // ==========================================
            // TAMBAHAN: LOGO PERUSAHAAN (SKENARIO 1)
            // ==========================================
            const logoGeo = new THREE.PlaneGeometry(6, 3);
            const logoMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, side: THREE.DoubleSide });
            
            // 1. Eksterior Depan (Dinding Utama Timur X=72, di atas pintu / segitiga atap)
            const logoDepan = new THREE.Mesh(logoGeo, logoMat.clone());
            // Posisi dimajukan ke 72.15 agar tidak tertelan ketebalan dinding
            logoDepan.position.set(72.15, 7.5, 12);
            logoDepan.rotation.y = Math.PI / 2;
            currentScenarioGroup.add(logoDepan);
            
            // 2. Interior Belakang (Dinding Dalam Barat X=0)
            const logoBelakang = new THREE.Mesh(logoGeo, logoMat.clone());
            // Posisi dimajukan ke 0.15 agar tidak tertelan ketebalan dinding
            logoBelakang.position.set(0.15, 4.5, 12);
            logoBelakang.rotation.y = Math.PI / 2;
            currentScenarioGroup.add(logoBelakang);

            const texLoader = new THREE.TextureLoader();
            texLoader.crossOrigin = "Anonymous";
            
            // Memuat logo dari file yang dilampirkan
            texLoader.load('image_a62588.png', 
                function(texture) {
                    // Jika sukses dimuat, pasang gambar
                    logoDepan.material.map = texture;
                    logoDepan.material.needsUpdate = true;
                    logoBelakang.material.map = texture;
                    logoBelakang.material.needsUpdate = true;
                },
                undefined,
                function(err) {
                    // Fallback: Jika gambar file gagal/terblokir sistem, buat logo canvas otomatis
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,512,256);
                    ctx.fillStyle = '#c0392b'; ctx.font = 'bold 150px Inter, sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('BSS', 256, 128); // Sesuai dengan tulisan pada gambar Anda
                    const fallbackTex = new THREE.CanvasTexture(canvas);
                    
                    logoDepan.material.map = fallbackTex;
                    logoDepan.material.needsUpdate = true;
                    logoBelakang.material.map = fallbackTex;
                    logoBelakang.material.needsUpdate = true;
                }
            );
        }

        // ==========================================
        // SKENARIO 2 (LAYOUT USULAN)
        // ==========================================
        function buildSkenario2() {
            // 1. AREA OFFICE & ISTIRAHAT (Statis)
            const offMat = new THREE.MeshStandardMaterial({ color: colors.officeWall });
            const officeBuilding = new THREE.Mesh(new THREE.BoxGeometry(9, 5.5, 12), offMat);
            officeBuilding.position.set(63 + 9/2, 5.5/2, 6 + 12/2); currentScenarioGroup.add(officeBuilding);
            const belt = new THREE.Mesh(new THREE.BoxGeometry(9.1, 0.4, 12.1), new THREE.MeshStandardMaterial({ color: colors.pillar }));
            belt.position.set(63 + 9/2, 5.5/2, 6 + 12/2); currentScenarioGroup.add(belt);
            const restWall = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 6), offMat);
            restWall.position.set(3, 1.5, 3); currentScenarioGroup.add(restWall);

            // 2. DEMARKASI AREA UTARA
            createArea(36, 0, 12, 6, 0xff0000, "Area Karantina");
            createArea(48, 0, 12, 6, 0xf39c12, "Area Transit");

            // Isi Transit Area dengan Palet Plastik & Barang
            for(let px = 50; px <= 58; px += 2.5) {
                for(let pz = 1.5; pz <= 4.5; pz += 1.5) {
                    if(Math.random() > 0.2) addPlasticPalletWithGoods(px, pz, currentScenarioGroup);
                }
            }

            // PEMBUATAN PAGAR (FENCE) AREA KARANTINA & TRANSIT
            function createFenceWall(x, z, length, rotationY) {
                const height = 2.5; 
                const group = new THREE.Group();
                const postGeo = new THREE.CylinderGeometry(0.05, 0.05, height, 8);
                const postMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.5 }); 
                
                for (let i = 0; i <= length + 0.01; i += 2) {
                    const post = new THREE.Mesh(postGeo, postMat);
                    post.position.set(i, height/2, 0);
                    post.castShadow = true;
                    group.add(post);
                }

                const panelGeo = new THREE.PlaneGeometry(length, height);
                const panelMat = new THREE.MeshStandardMaterial({ 
                    color: 0x666666, wireframe: true, transparent: true, opacity: 0.4, side: THREE.DoubleSide
                });
                const panel = new THREE.Mesh(panelGeo, panelMat);
                panel.position.set(length/2, height/2, 0);
                group.add(panel);
                
                const railGeo = new THREE.BoxGeometry(length, 0.05, 0.05);
                const topRail = new THREE.Mesh(railGeo, postMat);
                topRail.position.set(length/2, height - 0.1, 0);
                group.add(topRail);
                
                const bottomRail = new THREE.Mesh(railGeo, postMat);
                bottomRail.position.set(length/2, 0.2, 0);
                group.add(bottomRail);

                group.position.set(x, 0, z);
                group.rotation.y = rotationY;
                currentScenarioGroup.add(group);
            }

            // Memasang pagar depan untuk Karantina dan Transit
            createFenceWall(36, 6, 24, 0); 
            // Memasang pagar sekat pembatas samping
            createFenceWall(36, 6, 6, Math.PI / 2); // Sekat Kiri Karantina
            createFenceWall(48, 6, 6, Math.PI / 2); // Sekat Karantina - Transit
            createFenceWall(60, 6, 6, Math.PI / 2); // Sekat Kanan Transit

            // 3. RAK HEAVY DUTY VERTIKAL (Utara, X: 6-36, Z: 0-6)
            let hdNx = 6.2;
            const hdNz = 0.5;
            const hdNDepth = 5;
            
            createRackRow(hdNx, hdNz, 0.9, hdNDepth, 4, colors.rackHeavyFrame, colors.rackHeavyBeam, false, 4.5, 0, true);
            hdNx += 0.9 + 4.0;
            
            for(let i = 0; i < 5; i++) {
                createRackRow(hdNx, hdNz, 1.8, hdNDepth, 4, colors.rackHeavyFrame, colors.rackHeavyBeam, true, 4.5, 0, true);
                hdNx += 1.8 + 4.0;
            }

            // 4. RAK HEAVY DUTY HORIZONTAL & SMALL DUTY (Tengah, Z: 10-14)
            createArea(0, 6, 60, 4.0, 0xFFC107, "Jalur Forklift Atas (4m)");
            createArea(0, 14, 40.5, 4.0, 0xFFC107, "Jalur Forklift Bawah HD (4m)"); // Diperpendek hanya untuk area HD
            createArea(40.5, 19, 19.5, 2.5, 0xFFC107, "Jalur Forklift SD Bawah"); // Jalur Forklift dipindah ke bawah rak SD
            createArea(36, 10, 4.5, 4.0, 0xFFC107, "Jalur Vertikal (4.5m)");

            // -- Heavy Duty Horizontal --
            let hzX = 2.5;
            const hzZ = 10; 
            const hzDepth = 4; 
            for(let i=0; i<11; i++) {
                createRackRow(hzX, hzZ, 2.6, hzDepth, 4, colors.rackHeavyFrame, colors.rackHeavyBeam, true, 4.5, 0, true);
                hzX += 2.6 + 0.1; 
            }

            // 5. AREA CONTAINER & FLOOR KOLIAN (Selatan, X: 0-36, Z: 18-24)
            // Area Kontainer di Selatan
            const contGeo = new THREE.BoxGeometry(2.5, 2.5, 6);
            const contMat = new THREE.MeshStandardMaterial({ color: 0x2980b9 }); 
            for(let i=0; i<6; i++) {
                const startX = i * 6;
                const cont = new THREE.Mesh(contGeo, contMat);
                cont.position.set(startX + 1.25, 1.25, 21); 
                cont.castShadow = true;
                currentScenarioGroup.add(cont);
                
                createArea(startX + 2.5, 18, 3.5, 6, 0xffffff, "Floor Area");

                // TAMBAHAN: Palet Kayu + Material di Area Floor
                // KALIBRASI: Dihilangkan dari grid terakhir (startX = 30) agar area yang menjadi Aisle Forklift benar-benar bersih
                if (startX < 30) {
                    for(let px = startX + 3.2; px <= startX + 5.0; px += 1.5) { // Batas presisi agar tidak tumpah
                        for(let pz = 19; pz <= 23; pz += 1.5) {
                            if(Math.random() > 0.3) {
                                const palletGeo = new THREE.BoxGeometry(1.2, 0.15, 1.0);
                                const palletMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
                                const pallet = new THREE.Mesh(palletGeo, palletMat);
                                pallet.position.set(px, 0.075, pz);
                                pallet.castShadow = true;
                                currentScenarioGroup.add(pallet);

                                const boxH = 0.5 + Math.random() * 0.4;
                                const boxGeo = new THREE.BoxGeometry(1.1, boxH, 0.9);
                                const boxMat = new THREE.MeshStandardMaterial({ color: 0xb08d6a, roughness: 0.8 });
                                const box = new THREE.Mesh(boxGeo, boxMat);
                                box.position.set(px, 0.15 + boxH/2, pz);
                                box.castShadow = true;
                                currentScenarioGroup.add(box);
                                
                                const edges = new THREE.EdgesGeometry(boxGeo);
                                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x444444, linewidth: 1 }));
                                line.position.copy(box.position);
                                currentScenarioGroup.add(line);
                            }
                        }
                    }

                    // Spanduk "Part Get" tidak ditampilkan di Aisle Forklift
                    const bPartGet = createBanner("Part Get", "#27ae60", "#ffffff", 2.5, 0.8);
                    bPartGet.position.set(startX + 4.25, 1.5, 23.9);
                    bPartGet.rotation.y = Math.PI; 
                    currentScenarioGroup.add(bPartGet);
                }
            }

            // Proyeksi Mezzanine (Lantai 2) Plywood tebal di atas Kontainer & Floor Area
            // KALIBRASI: Batas presisi sejajar dengan Rak Heavy Duty sisi timur (X = 32.2)
            const mezContW = 32.2; 
            const mezContD = 6;
            const mezContH = 2.5; 
            const mezContThick = 0.15;
            const mezContFloor = new THREE.Mesh(new THREE.BoxGeometry(mezContW, mezContThick, mezContD), new THREE.MeshStandardMaterial({ color: 0xc19a6b, roughness: 1.0 })); 
            // Posisi tengah X disesuaikan, membentang persis dari X=0 hingga X=32.2
            mezContFloor.position.set(mezContW/2, mezContH + mezContThick/2, 21);
            mezContFloor.castShadow = true;
            mezContFloor.receiveShadow = true;
            currentScenarioGroup.add(mezContFloor);

            // Menambahkan Penghalang (Railing) FULL pada seluruh batas terbuka lantai 2
            const postMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.5 });
            
            // Railing Timur
            const barrierGroupEast = new THREE.Group();
            const railGeoEast = new THREE.BoxGeometry(0.05, 0.05, mezContD);
            const topRailEast = new THREE.Mesh(railGeoEast, postMat);
            topRailEast.position.set(0, 1.0, 0); barrierGroupEast.add(topRailEast);
            const midRailEast = new THREE.Mesh(railGeoEast, postMat);
            midRailEast.position.set(0, 0.5, 0); barrierGroupEast.add(midRailEast);
            for (let bz = -mezContD/2; bz <= mezContD/2 + 0.01; bz += 1.5) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8), postMat);
                post.position.set(0, 0.5, bz); barrierGroupEast.add(post);
            }
            barrierGroupEast.position.set(mezContW - 0.05, mezContH + mezContThick, 21);
            currentScenarioGroup.add(barrierGroupEast);

            // Railing Utara (Menghadap Jalur Forklift, Sepanjang tepi lantai 2)
            const barrierGroupNorth = new THREE.Group();
            const railGeoNorth = new THREE.BoxGeometry(mezContW, 0.05, 0.05);
            const topRailNorth = new THREE.Mesh(railGeoNorth, postMat);
            topRailNorth.position.set(mezContW/2, 1.0, 0); barrierGroupNorth.add(topRailNorth);
            const midRailNorth = new THREE.Mesh(railGeoNorth, postMat);
            midRailNorth.position.set(mezContW/2, 0.5, 0); barrierGroupNorth.add(midRailNorth);
            for (let bx = 0; bx <= mezContW; bx += 1.5) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8), postMat);
                post.position.set(bx, 0.5, 0); barrierGroupNorth.add(post);
            }
            barrierGroupNorth.position.set(0, mezContH + mezContThick, 18.05);
            currentScenarioGroup.add(barrierGroupNorth);

            // Menambahkan Jalur Aisle tepat di batas ujung timur kontainer (Mulai dari X=36, Lebar 4.5m)
            createArea(36, 18, 4.5, 6, 0xFFC107, "Aisle Forklift Timur Kontainer");

            // Tambahkan Material / Barang Kolian di Lantai 2 Mezzanine Kontainer
            // Dikalibrasi agar tumpukan barang berhenti sebelum batas ujung lantai 2
            for(let px = 1; px <= mezContW - 1; px += 1.5) {
                for(let pz = 18.5; pz <= 23.5; pz += 1.2) {
                    if(Math.random() > 0.4) { // 60% kemungkinan terisi barang
                        const boxH = 0.4 + Math.random() * 0.6;
                        const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, boxH, 0.8), new THREE.MeshStandardMaterial({ color: 0xb08d6a, roughness: 0.8 }));
                        box.position.set(px, mezContH + mezContThick + boxH/2, pz);
                        box.castShadow = true;
                        currentScenarioGroup.add(box);
                        
                        const edges = new THREE.EdgesGeometry(box.geometry);
                        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x444444, linewidth: 1 }));
                        line.position.copy(box.position);
                        currentScenarioGroup.add(line);
                    }
                }
            }

            // 5. RACKING AREA SMALL DUTY & MEZZANINE (X: 36 - 60m)
            let sdX = 36; 
            const sdDepth = 4.5;
            const sdZTop = 9.5; 
            const sdZBottom = 9.5 + sdDepth + 1.0; 
            
            const mezW = 24; const mezD = 10.0; const mezH = 2.5; const mezThickness = 0.1;
            const mezFloor = new THREE.Mesh(new THREE.BoxGeometry(mezW, mezThickness, mezD), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 1.0 }));
            mezFloor.position.set(sdX + mezW/2, mezH + mezThickness/2, sdZTop + mezD/2);
            currentScenarioGroup.add(mezFloor);
            
            createArea(36, 14, 24, 1.0, 0xFFC107, "Aisle Picking");

            for (let floor = 0; floor < 2; floor++) {
                let yOffset = floor === 0 ? 0 : mezH + mezThickness;
                let rx = sdX;
                
                createRackRow(rx, sdZTop, 0.6, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, false, mezH, yOffset, false, true);
                createRackRow(rx, sdZBottom, 0.6, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, false, mezH, yOffset, false, true);
                rx += 0.6 + 1.0; 
                
                for(let i = 0; i < 10; i++) {
                    createRackRow(rx, sdZTop, 1.2, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, true, mezH, yOffset, false, true);
                    createRackRow(rx, sdZBottom, 1.2, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, true, mezH, yOffset, false, true);
                    rx += 1.2 + 1.0;
                }
                
                createRackRow(rx, sdZTop, 0.6, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, false, mezH, yOffset, false, true);
                createRackRow(rx, sdZBottom, 0.6, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, false, mezH, yOffset, false, true);
            }

            // ==========================================
            // TAMBAHAN: SPANDUK AREA & K3/5R SKENARIO 2
            // ==========================================
            function createBanner(text, bgColor, fgColor, width, height) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Border
                ctx.strokeStyle = fgColor;
                ctx.lineWidth = 15;
                ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

                // Text
                ctx.fillStyle = fgColor;
                ctx.font = 'bold 70px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                
                const tex = new THREE.CanvasTexture(canvas);
                const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
                const geo = new THREE.PlaneGeometry(width, height);
                return new THREE.Mesh(geo, mat);
            }

            const bannerY = 4.5;
            const zWallNorth = 0.11; // Sedikit di depan dinding
            
            const bKarantina = createBanner("AREA KARANTINA", "#ff0000", "#ffffff", 6, 1.2);
            bKarantina.position.set(42, bannerY, zWallNorth); 
            currentScenarioGroup.add(bKarantina);

            const bTransit = createBanner("AREA TRANSIT", "#f39c12", "#ffffff", 6, 1.2);
            bTransit.position.set(54, bannerY, zWallNorth); 
            currentScenarioGroup.add(bTransit);

            const xOfficeWall = 62.85; // Menempel di dinding barat Office

            const bK3 = createBanner("UTAMAKAN K3", "#4CAF50", "#ffffff", 4.5, 1.2);
            bK3.position.set(xOfficeWall, bannerY, 9);
            bK3.rotation.y = -Math.PI / 2; // Diputar menghadap gudang
            currentScenarioGroup.add(bK3);

            const b5R = createBanner("BUDAYAKAN 5R", "#2196F3", "#ffffff", 4.5, 1.2);
            b5R.position.set(xOfficeWall, bannerY, 15);
            b5R.rotation.y = -Math.PI / 2;
            currentScenarioGroup.add(b5R);
        }

        // ==========================================
        // SWITCH LOGIC & EVENT LISTENERS
        // ==========================================
        function switchScenario(scenarioId) {
            document.getElementById('btn-scen-1').className = "w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm";
            document.getElementById('btn-scen-2').className = "w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm";
            document.getElementById('btn-scen-' + scenarioId).className = "w-1/2 bg-blue-600 text-white font-semibold py-1.5 rounded shadow transition text-sm";

            // Bersihkan objek dari skenario sebelumnya
            while(currentScenarioGroup.children.length > 0) {
                currentScenarioGroup.remove(currentScenarioGroup.children[0]);
            }

            // Bangun skenario baru
            if (scenarioId === 1) buildSkenario1();
            if (scenarioId === 2) buildSkenario2();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleRoof() {
            const isVisible = roofGroup.visible;
            roofGroup.visible = !isVisible;
            const btn = document.getElementById('toggle-roof');
            if(isVisible) {
                btn.innerText = "Tampilkan Atap";
                btn.classList.replace('bg-blue-500', 'bg-gray-500');
                btn.classList.replace('hover:bg-blue-600', 'hover:bg-gray-600');
            } else {
                btn.innerText = "Sembunyikan Atap";
                btn.classList.replace('bg-gray-500', 'bg-blue-500');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-blue-600');
            }
        }

        function resetCamera() {
            camera.position.set(-20, 40, 50);
            controls.target.set(WAREHOUSE_LENGTH / 2, 0, WAREHOUSE_WIDTH / 2);
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
