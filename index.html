<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi 3D Layout Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Mencegah scrollbar */
            background-color: #1a202c; /* Warna latar belakang fallback */
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Biarkan klik tembus ke kanvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            z-index: 10;
            display: none; /* Disembunyikan sebelum memilih skenario */
        }
        .ui-panel {
            pointer-events: auto; /* Panel UI bisa di-klik */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1rem;
        }
        /* Loading screen styling */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2d3748;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 50; transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top: 4px solid #fff;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Landing Page Menu */
        #landing-page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 100;
        }
    </style>
</head>
<body>

    <!-- LAYAR AWAL / MENU SKENARIO -->
    <div id="landing-page">
        <h2 class="text-3xl font-bold mb-2">Visualisasi 3D Gudang</h2>
        <p class="text-gray-400 mb-8">Pilih layout yang ingin Anda tampilkan</p>
        <div class="flex gap-4">
            <button onclick="startApp(1)" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold shadow-lg transition">Mulai Skenario 1<br><span class="text-sm font-normal">(Kalibrasi Eksisting)</span></button>
            <button onclick="startApp(2)" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-lg font-semibold shadow-lg transition">Mulai Skenario 2<br><span class="text-sm font-normal">(Layout Usulan)</span></button>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="display: none;">
        <div class="spinner"></div>
        <h2 class="text-xl font-semibold">Membangun Gudang 3D...</h2>
        <p class="text-sm text-gray-300 mt-2">Memuat geometri dan material</p>
    </div>

    <!-- UI LAYER DALAM 3D -->
    <div id="ui-layer">
        <div class="ui-panel max-w-sm">
            <h1 class="text-lg font-bold text-gray-800 border-b pb-2 mb-2">Gudang 72m x 24m</h1>
            <p class="text-sm text-gray-600 mb-2">Navigasi: <b>Klik Kiri + Seret</b> untuk memutar, <b>Scroll</b> untuk zoom, <b>Klik Kanan + Seret</b> untuk geser.</p>
            <div class="flex flex-wrap gap-2 text-xs mb-2">
                <span class="px-2 py-1 bg-indigo-100 text-indigo-800 rounded">Rak Slow Moving (Heavy)</span>
                <span class="px-2 py-1 bg-gray-200 text-gray-800 rounded">Rak Fast Moving (Small)</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded">Floor Area</span>
                <span class="px-2 py-1 bg-pink-100 text-pink-800 rounded">Karantina</span>
            </div>
            
            <!-- TOMBOL SWITCH SKENARIO -->
            <div class="mt-2 border-t pt-3 flex gap-2">
                <button id="btn-scen-1" onclick="switchScenario(1)" class="w-1/3 bg-blue-600 text-white font-semibold py-1.5 rounded shadow transition text-sm">Skenario 1</button>
                <button id="btn-scen-2" onclick="switchScenario(2)" class="w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm">Skenario 2</button>
                <button id="btn-scen-3" onclick="switchScenario(3)" class="w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm">Skenario 3</button>
            </div>

            <div class="mt-3 border-t pt-3">
                <button id="toggle-roof" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-1 px-4 rounded shadow transition text-sm">
                    Sembunyikan Atap
                </button>
            </div>
        </div>
        <div class="self-end pb-4 pr-4 pointer-events-auto flex flex-col gap-2">
            <button id="export-btn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow transition">
                Export Gambar HD
            </button>
            <button id="reset-cam" class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded shadow transition">
                Reset Kamera
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const WAREHOUSE_LENGTH = 72;
        const WAREHOUSE_WIDTH = 24;
        const WALL_HEIGHT = 6;
        const ROOF_HEIGHT = 10; 

        let scene, camera, renderer, controls;
        let roofGroup = new THREE.Group();
        let currentScenarioGroup = new THREE.Group(); // Group untuk layout dinamis
        
        const colors = {
            floor: 0xd9d5c3, wall: 0xeeeeee, pillar: 0x8b251e,
            roofExterior: 0xa0a0a0, roofInterior: 0xd0d0d0,
            rackHeavyFrame: 0x1565C0, rackHeavyBeam: 0xFF6600,
            rackSmallFrame: 0x9E9E9E, rackSmallShelf: 0xE0E0E0,
            officeWall: 0xf0f0f0,
            floorAreaBox: 0xcce0ff, karantinaBox: 0xffdcdc, packingBox: 0xd4edda,
            forkliftPath: 0xFFC107, pedestrianPath: 0x4CAF50, lineColor: 0x333333
        };

        let appInitialized = false;

        function startApp(scenarioId) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';
            
            setTimeout(() => {
                if (!appInitialized) {
                    init();
                    appInitialized = true;
                }
                switchScenario(scenarioId);
                
                document.getElementById('ui-layer').style.display = 'flex';
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 100); // Simulasi loading tipis
        }

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 150);
            scene.add(currentScenarioGroup); // Tambahkan group dinamis ke scene

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-20, 40, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.physicallyCorrectLights = false; 
            renderer.toneMapping = THREE.NoToneMapping; 
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.target.set(WAREHOUSE_LENGTH / 2, 0, WAREHOUSE_WIDTH / 2);

            setupLighting();
            buildStaticWarehouse(); // Hanya bangun Bangunan Statis (Lantai, Dinding, Atap)

            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('toggle-roof').addEventListener('click', toggleRoof);
            document.getElementById('reset-cam').addEventListener('click', resetCamera);
            document.getElementById('export-btn').addEventListener('click', exportHDImages);

            animate();
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 0.7); 
            hemiLight.position.set(0, 100, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(50, 80, 40);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.bias = -0.001; 
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = WAREHOUSE_LENGTH + 20;
            dirLight.shadow.camera.top = WAREHOUSE_WIDTH + 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);
        }

        // ==========================================
        // BANGUNAN STATIS (Tidak berubah per skenario)
        // ==========================================
        function buildStaticWarehouse() {
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a5d23, roughness: 1.0, metalness: 0.0 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.2;
            ground.receiveShadow = true;
            scene.add(ground);

            const slabThickness = 0.2;
            const floorGeo = new THREE.BoxGeometry(WAREHOUSE_LENGTH, slabThickness, WAREHOUSE_WIDTH);
            const floorMat = new THREE.MeshStandardMaterial({ color: colors.floor, roughness: 1.0, metalness: 0.0 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(WAREHOUSE_LENGTH/2, -slabThickness/2, WAREHOUSE_WIDTH/2);
            floor.receiveShadow = true;
            scene.add(floor);

            const wallThickness = 0.2;
            const wallMat = new THREE.MeshStandardMaterial({ color: colors.wall, side: THREE.DoubleSide });

            const wallNorth = new THREE.Mesh(new THREE.BoxGeometry(WAREHOUSE_LENGTH, WALL_HEIGHT, wallThickness), wallMat);
            wallNorth.position.set(WAREHOUSE_LENGTH/2, WALL_HEIGHT/2, 0);
            wallNorth.castShadow = true; wallNorth.receiveShadow = true;
            scene.add(wallNorth);

            const wallSouth = new THREE.Mesh(new THREE.BoxGeometry(WAREHOUSE_LENGTH, WALL_HEIGHT, wallThickness), wallMat);
            wallSouth.position.set(WAREHOUSE_LENGTH/2, WALL_HEIGHT/2, WAREHOUSE_WIDTH);
            wallSouth.castShadow = true; wallSouth.receiveShadow = true;
            scene.add(wallSouth);

            const wallWest = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, WALL_HEIGHT, WAREHOUSE_WIDTH), wallMat);
            wallWest.position.set(0, WALL_HEIGHT/2, WAREHOUSE_WIDTH/2);
            wallWest.castShadow = true; wallWest.receiveShadow = true;
            scene.add(wallWest);

            createEastWallWithDoors(wallThickness, wallMat);

            function createStripeTex(c1, c2) {
                const cv = document.createElement('canvas');
                cv.width = 128; cv.height = 128;
                const ctx = cv.getContext('2d');
                ctx.fillStyle = c1; ctx.fillRect(0,0,128,128);
                ctx.fillStyle = c2; 
                ctx.beginPath();
                for(let i=-128; i<256; i+=32) {
                    ctx.moveTo(i,0); ctx.lineTo(i+32,128); ctx.lineTo(i+48,128); ctx.lineTo(i+16,0);
                }
                ctx.fill();
                const tex = new THREE.CanvasTexture(cv);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }
            const hazardMat = new THREE.MeshBasicMaterial({ map: createStripeTex('#FFC107', '#000000') }); 
            const keepClearMat = new THREE.MeshBasicMaterial({ map: createStripeTex('#FF0000', '#FFFFFF') });

            const kcGeo = new THREE.BoxGeometry(4, 0.01, 3);
            const kc1 = new THREE.Mesh(kcGeo, keepClearMat);
            kc1.position.set(WAREHOUSE_LENGTH - 2, 0.02, 2 + 2.5);
            scene.add(kc1);
            const kc2 = new THREE.Mesh(kcGeo, keepClearMat);
            kc2.position.set(WAREHOUSE_LENGTH - 2, 0.02, WAREHOUSE_WIDTH - 2 - 2.5);
            scene.add(kc2);

            const pillarGeo = new THREE.BoxGeometry(0.4, WALL_HEIGHT, 0.4); 
            const pillarMat = new THREE.MeshStandardMaterial({ color: colors.pillar, metalness: 0.3, roughness: 0.7 });

            for (let i = 0; i <= 12; i++) {
                const xPos = i * 6;
                let p1 = new THREE.Mesh(pillarGeo, pillarMat);
                p1.position.set(xPos, WALL_HEIGHT/2, 0.2); 
                p1.castShadow = true;
                scene.add(p1);
                
                let p1Hazard = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.0, 0.42), hazardMat);
                p1Hazard.position.set(xPos, 0.5, 0.2);
                scene.add(p1Hazard);
                
                let p2 = new THREE.Mesh(pillarGeo, pillarMat);
                p2.position.set(xPos, WALL_HEIGHT/2, WAREHOUSE_WIDTH - 0.2);
                p2.castShadow = true;
                scene.add(p2);

                let p2Hazard = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.0, 0.42), hazardMat);
                p2Hazard.position.set(xPos, 0.5, WAREHOUSE_WIDTH - 0.2);
                scene.add(p2Hazard);
            }

            const roofShape = new THREE.Shape();
            roofShape.moveTo(0, WALL_HEIGHT);
            roofShape.lineTo(WAREHOUSE_WIDTH / 2, ROOF_HEIGHT); 
            roofShape.lineTo(WAREHOUSE_WIDTH, WALL_HEIGHT);
            roofShape.lineTo(WAREHOUSE_WIDTH, WALL_HEIGHT + 0.2); 
            roofShape.lineTo(WAREHOUSE_WIDTH / 2, ROOF_HEIGHT + 0.2);
            roofShape.lineTo(0, WALL_HEIGHT + 0.2);
            roofShape.lineTo(0, WALL_HEIGHT);

            const extrudeSettings = { steps: 1, depth: WAREHOUSE_LENGTH, bevelEnabled: false };
            const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
            const roofMat = new THREE.MeshStandardMaterial({ color: colors.roofExterior, side: THREE.DoubleSide, roughness: 0.6 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.rotation.y = Math.PI / 2;
            roof.position.set(0, 0, WAREHOUSE_WIDTH); 
            roof.castShadow = true;
            
            buildRoofTrusses(trussMat = new THREE.MeshStandardMaterial({ color: colors.pillar, metalness: 0.6, roughness: 0.4 }));
            roofGroup.add(roof);
            scene.add(roofGroup);
        }

        function createEastWallWithDoors(thick, mat) {
            const doorWidth = 5; const doorHeight = 4.5;
            const w1 = new THREE.Mesh(new THREE.BoxGeometry(thick, WALL_HEIGHT, 2), mat);
            w1.position.set(WAREHOUSE_LENGTH, WALL_HEIGHT/2, 1); scene.add(w1);

            const middleWidth = WAREHOUSE_WIDTH - (2 * doorWidth) - 4; 
            const w2 = new THREE.Mesh(new THREE.BoxGeometry(thick, WALL_HEIGHT, middleWidth), mat);
            w2.position.set(WAREHOUSE_LENGTH, WALL_HEIGHT/2, WAREHOUSE_WIDTH/2); scene.add(w2);

            const w3 = new THREE.Mesh(new THREE.BoxGeometry(thick, WALL_HEIGHT, 2), mat);
            w3.position.set(WAREHOUSE_LENGTH, WALL_HEIGHT/2, WAREHOUSE_WIDTH - 1); scene.add(w3);

            const topDoorGeo = new THREE.BoxGeometry(thick, WALL_HEIGHT - doorHeight, doorWidth);
            const td1 = new THREE.Mesh(topDoorGeo, mat);
            td1.position.set(WAREHOUSE_LENGTH, doorHeight + (WALL_HEIGHT - doorHeight)/2, 2 + doorWidth/2); scene.add(td1);

            const td2 = new THREE.Mesh(topDoorGeo, mat);
            td2.position.set(WAREHOUSE_LENGTH, doorHeight + (WALL_HEIGHT - doorHeight)/2, WAREHOUSE_WIDTH - 2 - doorWidth/2); scene.add(td2);
            
            const gableGeo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                0, WALL_HEIGHT, 0,
                0, ROOF_HEIGHT, WAREHOUSE_WIDTH/2,
                0, WALL_HEIGHT, WAREHOUSE_WIDTH
            ]);
            gableGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            gableGeo.computeVertexNormals();
            
            const gableEast = new THREE.Mesh(gableGeo, mat);
            gableEast.position.set(WAREHOUSE_LENGTH, 0, 0); scene.add(gableEast);

            const gableWest = new THREE.Mesh(gableGeo, new THREE.MeshStandardMaterial({ color: colors.wall, side: THREE.DoubleSide }));
            gableWest.position.set(0, 0, 0); scene.add(gableWest);
        }

        function buildRoofTrusses(trussMat) {
            function createBeam(p1, p2) {
                const distance = p1.distanceTo(p2);
                const geo = new THREE.CylinderGeometry(0.08, 0.08, distance, 8); 
                const mesh = new THREE.Mesh(geo, trussMat);
                mesh.position.copy(p1).lerp(p2, 0.5);
                const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                mesh.castShadow = true; return mesh;
            }
            for (let i = 0; i <= 12; i++) {
                const xPos = i * 6;
                const pBL = new THREE.Vector3(xPos, WALL_HEIGHT, 0); 
                const pBR = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH); 
                const pTop = new THREE.Vector3(xPos, ROOF_HEIGHT, WAREHOUSE_WIDTH/2); 
                const pMid = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH/2); 
                const pZ1 = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH/4);
                const pZ2 = new THREE.Vector3(xPos, WALL_HEIGHT + (ROOF_HEIGHT-WALL_HEIGHT)/2, WAREHOUSE_WIDTH/2);
                const pZ3 = new THREE.Vector3(xPos, WALL_HEIGHT, WAREHOUSE_WIDTH*0.75);

                roofGroup.add(createBeam(pBL, pBR)); roofGroup.add(createBeam(pBL, pTop)); roofGroup.add(createBeam(pBR, pTop)); 
                roofGroup.add(createBeam(pMid, pTop)); roofGroup.add(createBeam(pBL, pZ2)); roofGroup.add(createBeam(pZ1, pTop));
                roofGroup.add(createBeam(pBR, pZ2)); roofGroup.add(createBeam(pZ3, pTop));
            }
        }

        // ==========================================
        // FUNGSI HELPER INTERIOR & DEMARKASI
        // ==========================================
        function addSolidFloor(x, z, w, d, colorHex) {
            const geo = new THREE.PlaneGeometry(w, d);
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -1 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x + w/2, 0.01, z + d/2);
            mesh.receiveShadow = true;
            currentScenarioGroup.add(mesh);
        }

        function createSolidFloorBlock(x, z, w, d, colorHex, text) {
            const geo = new THREE.PlaneGeometry(w, d);
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -1 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x + w/2, 0.015, z + d/2);
            mesh.receiveShadow = true;
            currentScenarioGroup.add(mesh);

            if (text) {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = colorHex === 0xcccccc ? '#e0e0e0' : (colorHex === 0x2196F3 ? '#64b5f6' : '#ffffff');
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = colorHex === 0xcccccc ? '#555555' : '#000000';
                ctx.font = 'bold 50px Inter, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                const tex = new THREE.CanvasTexture(canvas);
                const bannerMat = new THREE.MeshBasicMaterial({ map: tex });
                const bannerGeo = new THREE.PlaneGeometry(w * 0.8, d * 0.4);
                const banner = new THREE.Mesh(bannerGeo, bannerMat);
                banner.rotation.x = -Math.PI / 2;
                banner.position.set(x + w/2, 0.02, z + d/2);
                currentScenarioGroup.add(banner);
            }
        }

        function createArea(x, z, w, d, color, name) {
            const yPos = 0.02; 
            const lineThickness = 0.1; 
            const borderMat = new THREE.MeshBasicMaterial({ color: color });
            
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.01, lineThickness), borderMat);
            top.position.set(x + w/2, yPos, z); currentScenarioGroup.add(top);

            const bottom = new THREE.Mesh(new THREE.BoxGeometry(w, 0.01, lineThickness), borderMat);
            bottom.position.set(x + w/2, yPos, z + d); currentScenarioGroup.add(bottom);

            const left = new THREE.Mesh(new THREE.BoxGeometry(lineThickness, 0.01, d), borderMat);
            left.position.set(x, yPos, z + d/2); currentScenarioGroup.add(left);

            const right = new THREE.Mesh(new THREE.BoxGeometry(lineThickness, 0.01, d), borderMat);
            right.position.set(x + w, yPos, z + d/2); currentScenarioGroup.add(right);
        }

        function createRackRow(x, z, width, depth, levels, frameColorStr, shelfColorStr, isDouble = false, customHeight = 4.5, yOffset = 0, hasPallets = false, hasJoliBoxes = false) {
            const group = new THREE.Group();
            group.position.set(x + width/2, yOffset, z + depth/2);

            const frameMat = new THREE.MeshStandardMaterial({ color: frameColorStr, metalness: 0.6, roughness: 0.4 });
            const beamMat = new THREE.MeshStandardMaterial({ color: shelfColorStr, metalness: 0.5, roughness: 0.5 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.9 }); 

            if (yOffset === 0) {
                const lineW = width + 0.3; const lineD = depth + 0.3; const lineT = 0.1; 
                const yMat = new THREE.MeshBasicMaterial({ color: 0xFFC107 });
                const yPosLine = 0.03; 
                const l1 = new THREE.Mesh(new THREE.BoxGeometry(lineW, 0.01, lineT), yMat); l1.position.set(0, yPosLine, -lineD/2);
                const l2 = new THREE.Mesh(new THREE.BoxGeometry(lineW, 0.01, lineT), yMat); l2.position.set(0, yPosLine, lineD/2);
                const l3 = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, lineD), yMat); l3.position.set(-lineW/2, yPosLine, 0);
                const l4 = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, lineD), yMat); l4.position.set(lineW/2, yPosLine, 0);
                group.add(l1, l2, l3, l4);
            }

            const bayLength = 2.6; 
            const numBays = Math.max(1, Math.round(depth / bayLength));
            const actualBayLength = depth / numBays;
            const postThickness = 0.1;
            
            let xPositions = isDouble ? [-width/2 + postThickness/2, 0, width/2 - postThickness/2] : [-width/2 + postThickness/2, width/2 - postThickness/2];

            for (let i = 0; i <= numBays; i++) {
                const zPos = -depth/2 + (i * actualBayLength);
                xPositions.forEach(xPos => {
                    const post = new THREE.Mesh(new THREE.BoxGeometry(postThickness, customHeight, postThickness), frameMat);
                    post.position.set(xPos, customHeight/2, zPos);
                    post.castShadow = true; post.receiveShadow = true; group.add(post);
                });
            }

            const beamThickness = 0.08; const beamHeight = 0.15;
            for (let lvl = 1; lvl <= levels; lvl++) {
                const yPos = lvl * (customHeight / levels);
                xPositions.forEach(xPos => {
                    const beam = new THREE.Mesh(new THREE.BoxGeometry(beamThickness, beamHeight, depth), beamMat);
                    beam.position.set(xPos, yPos, 0); beam.castShadow = true; beam.receiveShadow = true; group.add(beam);
                });
                const shelf = new THREE.Mesh(new THREE.BoxGeometry(width - postThickness*2, 0.02, depth - postThickness*2), woodMat);
                shelf.position.set(0, yPos, 0); shelf.castShadow = true; shelf.receiveShadow = true; group.add(shelf);

                // TAMBAHAN PALET
                if (hasPallets) {
                    const palletDepth = 1.0; const palletWidth = 0.8; const spacing = 0.2; 
                    const numPallets = Math.floor((depth - postThickness*2) / (palletDepth + spacing));
                    const startZOffset = -depth/2 + postThickness + (palletDepth/2) + 0.1;
                    let xOffsets = isDouble ? [-width/4, width/4] : [0];

                    for (let p = 0; p < numPallets; p++) {
                        const pzPos = startZOffset + p * (palletDepth + spacing);
                        xOffsets.forEach(px => {
                            if (Math.random() > 0.2) {
                                const pallet = new THREE.Mesh(new THREE.BoxGeometry(palletWidth, 0.12, palletDepth), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 }));
                                const pY = yPos + 0.01 + 0.06; pallet.position.set(px, pY, pzPos); pallet.castShadow = true; group.add(pallet);
                                
                                const boxH = 0.5 + Math.random() * 0.4;
                                const isCardboard = Math.random() > 0.3;
                                const box = new THREE.Mesh(new THREE.BoxGeometry(palletWidth - 0.05, boxH, palletDepth - 0.05), new THREE.MeshStandardMaterial({ color: isCardboard ? 0xb08d6a : 0x778899, roughness: 0.8 }));
                                box.position.set(px, pY + 0.06 + boxH/2, pzPos); box.castShadow = true; group.add(box);
                            }
                        });
                    }
                }

                // TAMBAHAN JOLI BOX
                if (hasJoliBoxes) {
                    const jBoxW = 0.3; const jBoxD = 0.4; const jBoxH = 0.25; const jSpacingX = 0.05; const jSpacingZ = 0.05;
                    const joliColors = [0x1976D2, 0xD32F2F, 0xFBC02D, 0x388E3C]; 
                    const usableDepth = depth - postThickness * 2;
                    const numJBoxZ = Math.floor(usableDepth / (jBoxD + jSpacingZ));
                    const startJZOffset = -depth/2 + postThickness + (jBoxD/2);
                    const usableWidth = isDouble ? (width/2 - postThickness*1.5) : (width - postThickness*2);
                    const numJBoxX = Math.floor(usableWidth / (jBoxW + jSpacingX));
                    let xCenters = isDouble ? [-width/4, width/4] : [0]; 

                    for (let jz = 0; jz < numJBoxZ; jz++) {
                        const jzPos = startJZOffset + jz * (jBoxD + jSpacingZ);
                        xCenters.forEach(centerX => {
                            const startJXOffset = centerX - (usableWidth/2) + (jBoxW/2);
                            for (let jx = 0; jx < numJBoxX; jx++) {
                                if (Math.random() > 0.25) {
                                    const px = startJXOffset + jx * (jBoxW + jSpacingX);
                                    const jColor = joliColors[Math.floor(Math.random() * joliColors.length)];
                                    const jBox = new THREE.Mesh(new THREE.BoxGeometry(jBoxW, jBoxH, jBoxD), new THREE.MeshStandardMaterial({ color: jColor, roughness: 0.6 }));
                                    jBox.position.set(px, yPos + 0.01 + jBoxH/2, jzPos); jBox.castShadow = true; group.add(jBox);
                                }
                            }
                        });
                    }
                }
            }
            currentScenarioGroup.add(group);
        }

            // Tiang Penyangga Mezzanine Transit (Menopang area 12x4)
            for(let x of [48.2, 51.0, 54.0, 57.0, 59.8]) { // Jarak tiang merata setiap ~3 meter

            // --- TAMBAHAN RAILING / PAGAR PENGAMAN MEZZANINE ---
            function addMezRailing(x1, z1, x2, z2) {
                const length = Math.hypot(x2 - x1, z2 - z1);
                const centerX = (x1 + x2) / 2;
                const centerZ = (z1 + z2) / 2;
                const angle = Math.atan2(z2 - z1, x2 - x1);
                
                const railingGroup = new THREE.Group();
                const postH = 1.0; // Tinggi railing 1m
                const railT = 0.05; // Ketebalan besi

                const topRail = new THREE.Mesh(new THREE.BoxGeometry(length, railT, railT), mezPostMat);
                topRail.position.set(0, postH, 0);
                railingGroup.add(topRail);
                
                // Tiang horizontal tengah
                const midRail = new THREE.Mesh(new THREE.BoxGeometry(length, railT, railT), mezPostMat);
                midRail.position.set(0, postH/2, 0);
                railingGroup.add(midRail);
                
                // Tiang vertikal (dipasang merata setiap jarak tertentu)
                const numPosts = Math.max(2, Math.ceil(length / 1.5) + 1);
                for(let i=0; i<numPosts; i++) {
                    const px = -length/2 + (i * (length / (numPosts-1)));
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, postH, 8), mezPostMat);
                    post.position.set(px, postH/2, 0);
                    railingGroup.add(post);
                }
                
                // Posisi Y 2.6 (2.5 tinggi lantai + 0.1 ketebalan plat lantai)
                railingGroup.position.set(centerX, 2.6, centerZ); 
                railingGroup.rotation.y = -angle;
                currentScenarioGroup.add(railingGroup);
            }

            // Memasang Railing di seluruh tepi luar Mezzanine Karantina dan Transit
            // Sisi Barat Karantina (Diberi celah di tengah Z=2.5 s/d 3.5 untuk akses tangga)
            addMezRailing(41, 0, 41, 2.5);

            addMezRailing(41, 6, 48, 6); // Sisi Selatan Karantina
            addMezRailing(48, 4, 48, 6); // Sisi Timur Karantina (perpotongan dengan Transit)
            addMezRailing(48, 4, 60, 4); // Sisi Selatan Transit
            addMezRailing(60, 0, 60, 4); // Sisi Timur Transit

            // --- TANGGA MEZZANINE KARANTINA (SISI BARAT) ---
            const stairGroupKar = new THREE.Group();
            const stepsKar = 14;

                // Turun ke arah Barat (koordinat X semakin mengecil)
                const offsetX = -1 * (i * stepWKar + stepWKar/2);
                step.position.set(41 + offsetX, 2.5 - (i * stepHKar) - stepHKar/2, 3.0);

            // Demarkasi Pembatas Ujung Tangga (Kuning)

            // Demarkasi Ujung Atas (Menempel di Lantai Mezzanine)

            topMarkerKar.position.set(41 + (lineTKar / 2), 2.61, 3.0);
            stairGroupKar.add(topMarkerKar);

            // Demarkasi Ujung Bawah (Menempel di Lantai Dasar Floor Area)
            const botMarkerKar = new THREE.Mesh(new THREE.BoxGeometry(lineTKar, 0.01, stairWKar), yellowMatKar);

            stairGroupKar.add(botMarkerKar);

            currentScenarioGroup.add(stairGroupKar);

            // --- TAMBAHAN TUMPUKAN KARDUS & PALET DI MEZZANINE (SKENARIO 1) ---
            const mezSurfaceY = 2.61; 
            
            function addDensePallets(startX, endX, startZ, endZ) {
                for(let px = startX; px <= endX; px += 1.3) {
                    for(let pz = startZ; pz <= endZ; pz += 1.1) {
                        if(Math.random() > 0.1) { // 90% terisi (sangat padat)
                            // 1. Palet Kayu
                            const pallet = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 1.0), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 }));
                            pallet.position.set(px, mezSurfaceY + 0.075, pz);
                            pallet.castShadow = true;
                            currentScenarioGroup.add(pallet);
                            
                            // 2. Tumpukan Kardus (1, 2, atau 3 susun)
                            const numStacks = Math.floor(Math.random() * 3) + 1; 
                            let currentY = mezSurfaceY + 0.15;
                            
                            for(let s = 0; s < numStacks; s++) {
                                const boxH = 0.4 + Math.random() * 0.2; 
                                const box = new THREE.Mesh(new THREE.BoxGeometry(1.1, boxH, 0.9), new THREE.MeshStandardMaterial({ color: 0xb08d6a, roughness: 0.8 }));
                                box.position.set(px, currentY + boxH/2, pz);
                                box.castShadow = true;
                                currentScenarioGroup.add(box);
                                
                                // Garis tepian kardus agar tumpukan terlihat jelas
                                const edges = new THREE.EdgesGeometry(box.geometry);
                                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x444444, linewidth: 1 }));
                                line.position.copy(box.position);
                                currentScenarioGroup.add(line);
                                
                                currentY += boxH; // Naik ke level tumpukan berikutnya
                            }
                        }
                    }
                }
            }

            // Area Karantina (X: 41 - 48, Z: 0 - 6) -> Disisakan sedikit margin (celah) untuk akses jalan/tangga
            addDensePallets(42.5, 47.5, 0.8, 5.2);
            
            // Area Transit (X: 48 - 60, Z: 0 - 4) -> Disisakan sedikit margin
            addDensePallets(48.8, 59.2, 0.8, 3.2);
            // ==========================================

            // 3. JALUR FORKLIFT Y2 & Y5
            addSolidFloor(0, 6, 60, 2.5, 0x2e7d32);
            createArea(0, 6, 60, 2.5, 0xFFC107, "Jalur Forklift Y2");
            
            addSolidFloor(0, 21.5, 60, 2.5, 0x2e7d32);
            createArea(0, 21.5, 60, 2.5, 0xFFC107, "Jalur Forklift Y5");

            // --- TAMBAHAN: MARKAH PENUNJUK ARAH LALU LINTAS DI LANTAI ---
            const cvsArrow = document.createElement('canvas');
            cvsArrow.width = 128; cvsArrow.height = 256;
            const ctxA = cvsArrow.getContext('2d');
            ctxA.fillStyle = '#FFFFFF'; // Warna putih untuk panah lalu lintas
            ctxA.beginPath();
            ctxA.moveTo(64, 20);   // Ujung atas panah
            ctxA.lineTo(108, 100); // Kanan bawah kepala panah
            ctxA.lineTo(84, 100);  // Masuk ke badan (tiang) kanan
            ctxA.lineTo(84, 236);  // Dasar badan kanan
            ctxA.lineTo(44, 236);  // Dasar badan kiri
            ctxA.lineTo(44, 100);  // Masuk ke badan (tiang) kiri
            ctxA.lineTo(20, 100);  // Kiri bawah kepala panah
            ctxA.fill();
            
            const texArrow = new THREE.CanvasTexture(cvsArrow);
            const matArrow = new THREE.MeshBasicMaterial({ map: texArrow, transparent: true, opacity: 0.9, polygonOffset: true, polygonOffsetFactor: -3 });
            
            function addFloorArrow(x, z, rotZ) {
                const arrow = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.4), matArrow);

            // Panah di Jalur Y5 (Arus Mobilitas ke arah Timur / Kanan)
            for(let px = 8; px <= 55; px += 10) {

            // 4. RACKING AREA HEAVY DUTY (X: 0 - 36m)
            const hdDepth = 9.6; 
            const hdZ = 9.5; 
            let hdX = 0; 
            
            // --- HAMPARAN HIJAU PENUH UNTUK SELURUH AREA HEAVY DUTY ---
            addSolidFloor(0, 8.5, 36, 13.0, 0x2e7d32); 

            // Helper untuk mengecat warna abu-abu (Light Grey) presisi tepat di bawah tapak rak
            function addRackFootprint(x, z, w, d, yBase) {
                // 1. Buat Tapak Abu-abu
                const geo = new THREE.PlaneGeometry(w, d);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x999999, // Abu-abu
                    roughness: 0.9,
                    polygonOffset: true,
                    polygonOffsetFactor: -2 // PAKSA render di atas lantai hijau (-1) agar tidak hilang
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(x + w/2, yBase + 0.018, z + d/2); 
                mesh.receiveShadow = true;
                currentScenarioGroup.add(mesh);

                // 2. Buat Garis Demarkasi Kuning Mengelilingi Tapak Rak
                const lineT = 0.1;
                const yMat = new THREE.MeshBasicMaterial({ color: 0xFFC107 });
                const pY = yBase + 0.02; // Letakkan persis di atas tapak abu-abu
                const l1 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.01, lineT), yMat); l1.position.set(x + w/2, pY, z); currentScenarioGroup.add(l1);
                const l2 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.01, lineT), yMat); l2.position.set(x + w/2, pY, z + d); currentScenarioGroup.add(l2);
                const l3 = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, d), yMat); l3.position.set(x, pY, z + d/2); currentScenarioGroup.add(l3);
                const l4 = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, d), yMat); l4.position.set(x + w, pY, z + d/2); currentScenarioGroup.add(l4);
            }

            // Fungsi bantuan untuk menempel panah di lantai lorong rak Heavy Duty
            let hdAisleDir = 0; 
            const addHDAisleArrows = (aisleX) => {
                const rot = hdAisleDir % 2 === 0 ? Math.PI : 0; // Selang-seling arah (Masuk/Keluar)
                
                const aTop = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 2.0), matArrow);
                aTop.rotation.x = -Math.PI / 2; aTop.rotation.z = rot;
                aTop.position.set(aisleX, 0.025, 12.0); // Lorong Atas
                currentScenarioGroup.add(aTop);

                const aBot = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 2.0), matArrow);
                aBot.rotation.x = -Math.PI / 2; aBot.rotation.z = rot;
                aBot.position.set(aisleX, 0.025, 16.5); // Lorong Bawah
                currentScenarioGroup.add(aBot);
                
                hdAisleDir++;
            };

            // Rak Ke-1 (Single 90)
            addRackFootprint(hdX, hdZ, 0.9, hdDepth, 0); 
            createRackRow(hdX, hdZ, 0.9, hdDepth, 4, colors.rackHeavyFrame, colors.rackHeavyBeam, false, 4.5, 0, true);
            hdX += 0.9 + 4.2; 
            addHDAisleArrows(hdX - 2.1); // Panah penunjuk jalan di lorong

                hdX += 1.8 + 4.2; 
                addHDAisleArrows(hdX - 2.1); // Panah penunjuk jalan di lorong

            addRackFootprint(hdX, hdZ, 0.9, hdDepth, 0); 
            createRackRow(hdX, hdZ, 0.9, hdDepth, 4, colors.rackHeavyFrame, colors.rackHeavyBeam, false, 4.5, 0, true);

            // 5. RACKING AREA SMALL DUTY & MEZZANINE (X: 36 - 60m)
            let sdX = 36; 
            const sdDepth = 4.5;
            const sdZTop = 9.5; 
            const sdZBottom = 9.5 + sdDepth + 1.0; 
            
            // --- HAMPARAN HIJAU PENUH UNTUK SELURUH AREA SMALL DUTY (LANTAI 1) ---
            addSolidFloor(36, 8.5, 24, 13.0, 0x2e7d32); 
            
            // PENYESUAIAN MEZZANINE: Lantai diperlebar 1m di Utara & Selatan untuk Railing & Akses
            const walkwayExt = 1.0;
            const mezW = 24; 
            const originalMezD = 10.0;
            const mezD = originalMezD + (walkwayExt * 2); // Menjadi 12.0
            const mezH = 2.5; const mezThickness = 0.1;
            
            // LANTAI MEZZANINE DIUBAH MENJADI HIJAU PENUH (0x2e7d32) AGAR TIDAK ADA PUTIH DI BAWAH RAK
            const mezFloor = new THREE.Mesh(new THREE.BoxGeometry(mezW, mezThickness, mezD), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 1.0 }));
            // Posisi Z-center tetap di 14.5
            mezFloor.position.set(sdX + mezW/2, mezH + mezThickness/2, sdZTop + originalMezD/2);
            mezFloor.castShadow = true; mezFloor.receiveShadow = true;
            currentScenarioGroup.add(mezFloor);
            
            // PEMASANGAN RAILING KELILING MEZZANINE
            const postMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.5 });
            const railingGroup = new THREE.Group();
            const railT = 0.05; const postH = 1.0;
            
            // Horizontal Rails (Utara & Selatan)
            const railLongGeo = new THREE.BoxGeometry(mezW, railT, railT);
            const topN = new THREE.Mesh(railLongGeo, postMat); topN.position.set(sdX + mezW/2, mezH + postH, 14.5 - mezD/2); railingGroup.add(topN);
            const midN = new THREE.Mesh(railLongGeo, postMat); midN.position.set(sdX + mezW/2, mezH + postH/2, 14.5 - mezD/2); railingGroup.add(midN);
            const topS = new THREE.Mesh(railLongGeo, postMat); topS.position.set(sdX + mezW/2, mezH + postH, 14.5 + mezD/2); railingGroup.add(topS);
            const midS = new THREE.Mesh(railLongGeo, postMat); midS.position.set(sdX + mezW/2, mezH + postH/2, 14.5 + mezD/2); railingGroup.add(midS);
            
            // Horizontal Rails (Barat & Timur)
            const railShortGeo = new THREE.BoxGeometry(railT, railT, mezD);
            const topW = new THREE.Mesh(railShortGeo, postMat); topW.position.set(sdX, mezH + postH, 14.5); railingGroup.add(topW);
            const midW = new THREE.Mesh(railShortGeo, postMat); midW.position.set(sdX, mezH + postH/2, 14.5); railingGroup.add(midW);
            const topE = new THREE.Mesh(railShortGeo, postMat); topE.position.set(sdX + mezW, mezH + postH, 14.5); railingGroup.add(topE);
            const midE = new THREE.Mesh(railShortGeo, postMat); midE.position.set(sdX + mezW, mezH + postH/2, 14.5); railingGroup.add(midE);

            // Tiang Railing (Posts)
            for(let px = sdX; px <= sdX + mezW + 0.01; px += 1.5) {
                const postN = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, postH, 8), postMat);
                postN.position.set(px, mezH + postH/2, 14.5 - mezD/2); railingGroup.add(postN);
                const postS = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, postH, 8), postMat);
                postS.position.set(px, mezH + postH/2, 14.5 + mezD/2); railingGroup.add(postS);
            }
            for(let pz = 14.5 - mezD/2; pz <= 14.5 + mezD/2 + 0.01; pz += 1.5) {
                const postW = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, postH, 8), postMat);
                postW.position.set(sdX, mezH + postH/2, pz); railingGroup.add(postW);
                const postE = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, postH, 8), postMat);
                postE.position.set(sdX + mezW, mezH + postH/2, pz); railingGroup.add(postE);
            }
            currentScenarioGroup.add(railingGroup);

            // TANGGA MEZZANINE (KIRI & KANAN)
            function createMezStaircase(startX, startZ, directionX) {
                const stairGroup = new THREE.Group();
                const steps = 14;
                const stepH = mezH / steps;
                const stepW = 3.0 / steps; // Panjang run tangga 3 meter
                const stairWidth = 1.0; 
                const stepMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.9 });
                
                for(let i=0; i<steps; i++) {
                    const step = new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, stairWidth), stepMat);
                    // directionX = 1 (turun ke timur), -1 (turun ke barat)
                    const offsetX = directionX * (i * stepW + stepW/2);
                    step.position.set(startX + offsetX, mezH - (i * stepH) - stepH/2, startZ);
                    step.castShadow = true; step.receiveShadow = true;
                    stairGroup.add(step);
                }

                // Tambahan Demarkasi Pembatas Ujung Tangga (Kuning)
                const lineT = 0.1;
                const yellowMat = new THREE.MeshBasicMaterial({ color: 0xFFC107 });
                
                // Demarkasi Ujung Atas (Lantai Mezzanine)
                const topMarker = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, stairWidth), yellowMat);
                // Diletakkan tepat di batas awal sebelum menuruni anak tangga pertama
                topMarker.position.set(startX - (directionX * lineT / 2), mezH + mezThickness + 0.01, startZ);
                stairGroup.add(topMarker);

                const bottomMarker = new THREE.Mesh(new THREE.BoxGeometry(lineT, 0.01, stairWidth), yellowMat);
                // Diletakkan tepat di lantai dasar setelah anak tangga terakhir
                bottomMarker.position.set(startX + (directionX * 3.0) + (directionX * lineT / 2), 0.025, startZ);
                stairGroup.add(bottomMarker);

                currentScenarioGroup.add(stairGroup);
            }

            createMezStaircase(sdX + 1.0, 14.5 + mezD/2 - 0.5, -1);
            createMezStaircase(sdX + mezW - 1.0, 14.5 + mezD/2 - 0.5, 1);

            for (let floor = 0; floor < 2; floor++) {
                let yOffset = floor === 0 ? 0 : mezH + mezThickness;
                let arrowY = floor === 0 ? 0.025 : mezH + mezThickness + 0.025; // Ketinggian panah di lantai 1 vs lantai 2
                let rx = sdX;
                let aisleDir = 0; // 0 untuk Masuk (Selatan), 1 untuk Keluar (Utara)

                const addAisleArrows = (aisleX) => {

                    const aTop = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.2), matArrow);

                    aBot.position.set(aisleX, arrowY, 17.25); // Lorong Bawah
                    currentScenarioGroup.add(aBot);

                createRackRow(rx, sdZBottom, 0.6, sdDepth, 3, colors.rackSmallFrame, colors.rackSmallShelf, false, mezH, yOffset, false, true);

            // ==========================================
            // TAMBAHAN: SPANDUK ALAT BERAT DI UJUNG RAK (SKENARIO 1)

            function createEqBannerScen1(brand, bannerWidth, bannerHeight) {
                const canvas = document.createElement('canvas');

                const ctx = canvas.getContext('2d');
                
                // Background & Border
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 1024);

            function createSafetySign(type, width, height) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = type.includes('danger') ? 384 : 256; 
                if(type === 'direction') { canvas.width = 512; canvas.height = 256; }
                
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                
                // Base background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                if (type === 'warning') { // Peringatan (Kuning Belah Ketupat)
                    ctx.fillStyle = '#ffeb3b';
                    ctx.beginPath(); ctx.moveTo(w/2, 10); ctx.lineTo(w-10, h/2); ctx.lineTo(w/2, h-10); ctx.lineTo(10, h/2); ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 10; ctx.stroke();
                    ctx.fillStyle = '#000'; ctx.font = 'bold 120px Arial'; ctx.fillText('!', w/2, h/2 + 10);
                } 
                else if (type === 'forbidden_s') { // Larangan (Dilarang Stop - Merah)
                    ctx.fillStyle = '#000'; ctx.font = 'bold 120px Arial'; ctx.fillText('S', w/2, h/2 + 15);
                    ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 25;
                    ctx.beginPath(); ctx.arc(w/2, h/2, w/2 - 25, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(w*0.25, h*0.25); ctx.lineTo(w*0.75, h*0.75); ctx.stroke();
                }
                else if (type === 'mandatory') { // Wajib (Wajib APD - Biru)
                    ctx.fillStyle = '#1976d2'; ctx.beginPath(); ctx.arc(w/2, h/2, w/2 - 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(w/2, h/2 + 10, 40, Math.PI, 0); ctx.fill(); 
                    ctx.fillRect(w/2 - 50, h/2 + 10, 100, 15); // Bentuk helm simpel
                    ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#000'; ctx.fillText('WAJIB APD', w/2, h - 15);
                }
                else if (type === 'facility') { // Fasilitas Publik (Makan/Istirahat)
                    ctx.strokeStyle = '#1976d2'; ctx.lineWidth = 20; ctx.strokeRect(10, 10, w-20, h-20);
                    ctx.fillStyle = '#000'; ctx.font = 'bold 100px Arial'; ctx.fillText('🍴', w/2, h/2 + 10);
                }
                else if (type === 'danger') { // Bahaya (Danger Do Not Enter)
                    ctx.fillStyle = '#000'; ctx.fillRect(10, 10, w-20, h*0.35);
                    ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.ellipse(w/2, h*0.18, w*0.4, h*0.12, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 45px Arial'; ctx.fillText('DANGER', w/2, h*0.18);
                    ctx.fillStyle = '#000'; ctx.font = 'bold 40px Arial'; ctx.fillText('DO NOT', w/2, h*0.65); ctx.fillText('ENTER', w/2, h*0.80);
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeRect(5, 5, w-10, h-10);
                }
                else if (type === 'fire') { // Pemadam / APAR (Segitiga Merah)
                    ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(w-10, 10); ctx.lineTo(w/2, h-10); ctx.fill();

                const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });

            function createSafetySign(type, width, height) {
                const canvas = document.createElement('canvas'); canvas.width = type === 'direction' ? 512 : 256; canvas.height = type.includes('danger') ? 384 : 256; 
                const ctx = canvas.getContext('2d'); const w = canvas.width; const h = canvas.height;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                if (type === 'warning') { ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.moveTo(w/2, 10); ctx.lineTo(w-10, h/2); ctx.lineTo(w/2, h-10); ctx.lineTo(10, h/2); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 10; ctx.stroke(); ctx.fillStyle = '#000'; ctx.font = 'bold 120px Arial'; ctx.fillText('!', w/2, h/2 + 10); } 
                else if (type === 'forbidden_s') { ctx.fillStyle = '#000'; ctx.font = 'bold 120px Arial'; ctx.fillText('S', w/2, h/2 + 15); ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 25; ctx.beginPath(); ctx.arc(w/2, h/2, w/2 - 25, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w*0.25, h*0.25); ctx.lineTo(w*0.75, h*0.75); ctx.stroke(); }
                else if (type === 'mandatory') { ctx.fillStyle = '#1976d2'; ctx.beginPath(); ctx.arc(w/2, h/2, w/2 - 20, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(w/2, h/2 + 10, 40, Math.PI, 0); ctx.fill(); ctx.fillRect(w/2 - 50, h/2 + 10, 100, 15); ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#000'; ctx.fillText('WAJIB APD', w/2, h - 15); }
                else if (type === 'facility') { ctx.strokeStyle = '#1976d2'; ctx.lineWidth = 20; ctx.strokeRect(10, 10, w-20, h-20); ctx.fillStyle = '#000'; ctx.font = 'bold 100px Arial'; ctx.fillText('🍴', w/2, h/2 + 10); }
                else if (type === 'danger') { ctx.fillStyle = '#000'; ctx.fillRect(10, 10, w-20, h*0.35); ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.ellipse(w/2, h*0.18, w*0.4, h*0.12, 0, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 45px Arial'; ctx.fillText('DANGER', w/2, h*0.18); ctx.fillStyle = '#000'; ctx.font = 'bold 40px Arial'; ctx.fillText('DO NOT', w/2, h*0.65); ctx.fillText('ENTER', w/2, h*0.80); ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeRect(5, 5, w-10, h-10); }
                else if (type === 'fire') { ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(w-10, 10); ctx.lineTo(w/2, h-10); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.fillText('APAR', w/2, h*0.25); ctx.fillRect(w/2 - 15, h*0.35, 30, h*0.3); ctx.fillRect(w/2 - 5, h*0.3, 10, h*0.05); }
                else if (type === 'direction') { ctx.fillStyle = '#2e7d32'; ctx.fillRect(0,0,w,h); ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.strokeRect(10,10,w-20, h-20); ctx.fillStyle = '#fff'; ctx.font = 'bold 60px Arial'; ctx.fillText('PINTU KELUAR ➔', w/2, h/2); }
                else if (type === 'eyewash') { ctx.fillStyle = '#2e7d32'; ctx.fillRect(0,0,w,h); ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.strokeRect(10,10,w-20, h-20); ctx.fillStyle = '#fff'; ctx.font = 'bold 35px Arial'; ctx.fillText('EMERGENCY', w/2, h*0.35); ctx.font = 'bold 50px Arial'; ctx.fillText('EYE WASH', w/2, h*0.65); }
                const tex = new THREE.CanvasTexture(canvas); return new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
            }

                const aparHead = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.15, 16), new THREE.MeshStandardMaterial({color: 0x333333})); aparHead.position.set(0, 1.1, 0.05); group.add(aparHead);
                const aparHose = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), new THREE.MeshStandardMaterial({color: 0x111111})); aparHose.position.set(0.13, 0.8, 0.05); group.add(aparHose);
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#e53935'; ctx.fillRect(0,0,256,256); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 15; ctx.strokeRect(10,10,236,236);
                ctx.beginPath(); ctx.moveTo(10,10); ctx.lineTo(246,246); ctx.stroke(); ctx.beginPath(); ctx.moveTo(246,10); ctx.lineTo(10,246); ctx.stroke();
                const demarkasi = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.9, polygonOffset: true, polygonOffsetFactor: -3}));
                demarkasi.rotation.x = -Math.PI/2; demarkasi.position.set(0, 0.03, 0.6); group.add(demarkasi);
                group.position.set(x, 0, z); group.rotation.y = rotY; currentScenarioGroup.add(group);
            }
            createAparStation(12, 0.41, 0); createAparStation(30, 0.41, 0); createAparStation(48, 0.41, 0); createAparStation(60, 0.41, 0);
            createAparStation(12, 23.59, Math.PI); createAparStation(30, 23.59, Math.PI); createAparStation(48, 23.59, Math.PI); createAparStation(60, 23.59, Math.PI);

            // 10. MARKAH PANAH JALUR & EVAKUASI (Disamakan Skenario 1)
            const cvsArrow = document.createElement('canvas'); cvsArrow.width = 128; cvsArrow.height = 256; const ctxA = cvsArrow.getContext('2d');
            ctxA.fillStyle = '#FFFFFF'; ctxA.beginPath(); ctxA.moveTo(64, 20); ctxA.lineTo(108, 100); ctxA.lineTo(84, 100); ctxA.lineTo(84, 236); ctxA.lineTo(44, 236); ctxA.lineTo(44, 100); ctxA.lineTo(20, 100); ctxA.fill();
            const matArrow = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cvsArrow), transparent: true, opacity: 0.9, polygonOffset: true, polygonOffsetFactor: -3 });
            function addFloorArrow(x, z, rotZ) {
                const arrow = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.4), matArrow); arrow.rotation.x = -Math.PI / 2; arrow.rotation.z = rotZ; arrow.position.set(x, 0.025, z); currentScenarioGroup.add(arrow);
            }
            for(let px = 8; px <= 55; px += 10) addFloorArrow(px, 8.0, Math.PI / 2); // Jalur Atas Z=8
            for(let px = 8; px <= 55; px += 10) addFloorArrow(px, 22.0, -Math.PI / 2); // Jalur Bawah Z=22

            function addEvacMarker(x, z) {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128; const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2e7d32'; ctx.fillRect(0,0,512,128); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, 502, 118);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 45px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('JALUR EVAKUASI  ➔', 256, 64);

        function switchScenario(scenarioId) {
            document.getElementById('btn-scen-1').className = "w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm";
            document.getElementById('btn-scen-2').className = "w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm";
            document.getElementById('btn-scen-3').className = "w-1/3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-1.5 rounded shadow transition text-sm";
            document.getElementById('btn-scen-' + scenarioId).className = "w-1/3 bg-blue-600 text-white font-semibold py-1.5 rounded shadow transition text-sm";

            // Bersihkan objek dari skenario sebelumnya
            while(currentScenarioGroup.children.length > 0) {
                currentScenarioGroup.remove(currentScenarioGroup.children[0]);
            }

            // Bangun skenario baru
            if (scenarioId === 1) buildSkenario1();
            if (scenarioId === 2) buildSkenario2();
            if (scenarioId === 3) buildSkenario3();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleRoof() {
            const isVisible = roofGroup.visible;
            roofGroup.visible = !isVisible;
            const btn = document.getElementById('toggle-roof');
            if(isVisible) {
                btn.innerText = "Tampilkan Atap";
                btn.classList.replace('bg-blue-500', 'bg-gray-500');
                btn.classList.replace('hover:bg-blue-600', 'hover:bg-gray-600');
            } else {
                btn.innerText = "Sembunyikan Atap";
                btn.classList.replace('bg-gray-500', 'bg-blue-500');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-blue-600');
            }
        }

        function resetCamera() {
            camera.position.set(-20, 40, 50);
            controls.target.set(WAREHOUSE_LENGTH / 2, 0, WAREHOUSE_WIDTH / 2);
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        async function exportHDImages() {
            const btn = document.getElementById('export-btn');
            const originalText = btn.innerText;
            btn.innerText = "Memproses HD...";
            btn.disabled = true;

            // 1. Simpan setelan layar dan kamera pengguna saat ini
            const origWidth = window.innerWidth;
            const origHeight = window.innerHeight;
            const origPos = camera.position.clone();
            const origTarget = controls.target.clone();

            // 2. Setel resolusi ke 4K (Ultra HD) untuk ketajaman standar sipil
            const hdWidth = 3840;
            const hdHeight = 2160;
            renderer.setSize(hdWidth, hdHeight);
            camera.aspect = hdWidth / hdHeight;
            camera.updateProjectionMatrix();

            // 3. Tentukan Perspektif Standar (Atas, Depan, Isometrik Kiri, Isometrik Kanan)
            const civilPerspectives = [
                { name: "1_Tampak_Atas_Plan", pos: [WAREHOUSE_LENGTH/2, 100, WAREHOUSE_WIDTH/2], target: [WAREHOUSE_LENGTH/2, 0, WAREHOUSE_WIDTH/2] },
                { name: "2_Tampak_Depan_Elevation", pos: [WAREHOUSE_LENGTH/2, 5, 90], target: [WAREHOUSE_LENGTH/2, 5, WAREHOUSE_WIDTH/2] },
                { name: "3_Perspektif_Isometrik_Barat", pos: [-40, 60, 60], target: [WAREHOUSE_LENGTH/2, 0, WAREHOUSE_WIDTH/2] },
                { name: "4_Perspektif_Isometrik_Timur", pos: [WAREHOUSE_LENGTH + 40, 60, 60], target: [WAREHOUSE_LENGTH/2, 0, WAREHOUSE_WIDTH/2] }
            ];

            // 4. Render dan Unduh satu per satu
            for (let i = 0; i < civilPerspectives.length; i++) {
                const view = civilPerspectives[i];
                camera.position.set(...view.pos);
                controls.target.set(...view.target);
                controls.update();
                renderer.render(scene, camera); // Paksa render ulang

                // Langsung ambil gambar sesaat setelah dirender (TANPA jeda await) agar layar tidak keburu dikosongkan
                const dataURL = renderer.domElement.toDataURL('image/png', 1.0);
                const link = document.createElement('a');
                link.download = `Desain_Gudang_${view.name}.png`;
                link.href = dataURL;
                link.click();
                
                // Jeda diletakkan SETELAH gambar diambil, agar browser tidak hang karena mengunduh 4 gambar sekaligus
                await new Promise(r => setTimeout(r, 600)); 
            }

            // 5. Kembalikan layar dan kamera ke posisi awal (Normal)
            renderer.setSize(origWidth, origHeight);
            camera.aspect = origWidth / origHeight;
            camera.updateProjectionMatrix();
            camera.position.copy(origPos);
            controls.target.copy(origTarget);
            controls.update();
            
            btn.innerText = originalText;
            btn.disabled = false;
        }
    </script>
